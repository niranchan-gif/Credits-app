name: credit
description: Credits - Loan Manager App with unique borrower IDs and daily payment tracking.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  sqflite: ^2.3.0
  path: ^1.9.0
  provider: ^6.1.1
  intl: ^0.19.0
  excel: ^4.0.6
  path_provider: ^2.1.2
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.2
  open_filex: ^4.7.0
  url_launcher: ^6.3.1
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3
  sqflite_common_ffi: ^2.3.6

flutter:
  uses-material-design: true

  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true

  image_path: assets/icon/app_icon.png

  min_sdk_android: 21

  adaptive_icon_background: "#0D3833"
  adaptive_icon_foreground: assets/icon/app_icon.png