name: credit
description: Credits - Loan Manager App with unique borrower IDs and daily payment tracking.
publish_to: 'none'
version: 1.1.0+3

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  sqflite: ^2.3.0
  path: ^1.9.0
  provider: ^6.1.1
  intl: ^0.19.0
  excel: ^4.0.6
  path_provider: ^2.1.2
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.2
  flutter_local_notifications: ^17.2.4
  open_filex: ^4.7.0
  url_launcher: ^6.3.1
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  hugeicons: ^1.1.2
  uuid: ^4.3.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  file_picker: ^8.1.6
  google_sign_in: ^6.2.1
  googleapis: ^13.0.0
  googleapis_auth: ^1.4.1
  crypto: ^3.0.3
  http: ^1.2.0
  encrypt: ^5.0.3
  sqflite_common_ffi: ^2.3.0
  pdf: ^3.10.8
  share_plus: ^12.0.2
  printing: ^5.14.3
  screenshot: ^3.0.0
  package_info_plus: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3


flutter:
  uses-material-design: true

  assets:
    - assets/icon/
    - assets/fonts/

flutter_launcher_icons:
  android: true
  ios: true

  image_path: assets/icon/app_icon.png

  min_sdk_android: 21

  adaptive_icon_background: "#0D3833"
  adaptive_icon_foreground: assets/icon/app_icon.png